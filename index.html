<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Weather App</h1>

      <div class="search-box">
        <input type="text" placeholder="Enter city name..." />
        <button class="seacrhBtn">Search</button>
      </div>

      <p class="city-name">New Delhi, <span>IN</span></p>
      <p class="temperature">28°C</p>
      <p class="condition">Partly Cloudy</p>

      <hr />

      <div class="stats">
        <div class="stat-box">
          <p>Humidity</p>
          <h3 class="humidity">62%</h3>
        </div>
        <div class="stat-box">
          <p>Wind</p>
          <h3 class="wind">14 km/h</h3>
        </div>
        <div class="stat-box">
          <p>Feels Like</p>
          <h3 class="feet-like">31°C</h3>
        </div>
      </div>

      <p class="forecast-title">5-Day Forecast</p>

      <div class="forecast">
        <div class="forecast-day">
          <p>Mon</p>
          <h4>30°</h4>
          <span>21°</span>
        </div>

        <div class="forecast-day">
          <p>Tue</p>
          <h4>27°</h4>
          <span>19°</span>
        </div>

        <div class="forecast-day">
          <p>Wed</p>
          <h4>25°</h4>
          <span>18°</span>
        </div>

        <div class="forecast-day">
          <p>Thu</p>
          <h4>29°</h4>
          <span>20°</span>
        </div>

        <div class="forecast-day">
          <p>Fri</p>
          <h4>26°</h4>
          <span>17°</span>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
